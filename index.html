<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Las fechas que importan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#14122b;
    --night-2:#1d1a3c;
    --card:#232049;
    --card-line:#3a356b;
    --gold:#e8b95f;
    --gold-soft:#f4d597;
    --ink:#ece9f7;
    --muted:#9a95c0;
    --ok:#74d6ab;
    --err:#e88a9a;
    --shadow:0 24px 60px -20px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Inter",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #2a2559 0%, transparent 60%),
      linear-gradient(160deg, var(--night-1), var(--night-2));
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 18px;
    -webkit-font-smoothing:antialiased;
  }
  /* faint stars in the background */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none;
    background-image:
      radial-gradient(1.4px 1.4px at 20% 30%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.2px 1.2px at 75% 20%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.6px 1.6px at 85% 65%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.1px 1.1px at 15% 75%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.3px 1.3px at 55% 85%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.1px 1.1px at 40% 12%, rgba(255,255,255,.35), transparent);
  }
  .stage{
    width:100%;
    max-width:560px;
    background:linear-gradient(180deg, rgba(43,39,86,.92), rgba(30,27,60,.92));
    border:1px solid var(--card-line);
    border-radius:22px;
    padding:38px 34px 34px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .eyebrow{
    font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--gold); font-weight:600; margin:0 0 6px;
  }
  /* constellation */
  .constellation{width:100%; height:64px; margin:2px 0 26px; display:block}
  .line{stroke:var(--card-line); stroke-width:1.5; transition:stroke .6s ease}
  .line.lit{stroke:var(--gold)}
  .star{fill:#3a356b; transition:fill .5s ease, filter .5s ease}
  .star.lit{fill:var(--gold); filter:drop-shadow(0 0 6px rgba(232,185,95,.8))}
  .star.current{fill:var(--gold-soft); filter:drop-shadow(0 0 8px rgba(244,213,151,.9)); animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  .count{font-size:12px; color:var(--muted); letter-spacing:.04em; margin:0 0 14px}
  .question{
    font-family:"Fraunces",Georgia,serif;
    font-weight:600; font-size:clamp(26px,5.5vw,34px);
    line-height:1.15; margin:0 0 8px; letter-spacing:-.01em;
  }
  .hint{font-size:13.5px; color:var(--muted); margin:0 0 22px; font-style:italic}
  .hint b{color:var(--gold-soft); font-style:normal; font-weight:500}

  .field{display:flex; gap:10px; margin-top:6px}
  input[type=text]{
    flex:1; min-width:0;
    background:#191636; border:1px solid var(--card-line);
    color:var(--ink); font-size:16px; font-family:inherit;
    padding:14px 16px; border-radius:12px; outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input[type=text]::placeholder{color:#6f6a99}
  input[type=text]:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(232,185,95,.18)}
  button{
    font-family:inherit; font-weight:600; font-size:15px;
    color:#241d05; background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    border:none; border-radius:12px; padding:0 20px; cursor:pointer;
    transition:transform .12s ease, filter .2s ease; white-space:nowrap;
  }
  button:hover{filter:brightness(1.05)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:3px solid rgba(232,185,95,.5); outline-offset:2px}

  .feedback{min-height:22px; margin-top:14px; font-size:14px}
  .feedback.err{color:var(--err)}
  .feedback.ok{color:var(--ok)}
  .shake{animation:shake .4s}
  @keyframes shake{
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
    40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}
  }

  /* final reveal */
  .reveal{text-align:center; padding:6px 0}
  .reveal .glyph{font-size:44px; margin-bottom:6px; filter:drop-shadow(0 0 12px rgba(232,185,95,.7))}
  .reveal h2{font-family:"Fraunces",serif; font-weight:600; font-size:30px; margin:6px 0 6px}
  .reveal p{color:var(--muted); margin:0 auto 24px; max-width:38ch; line-height:1.55}
  .reveal .link-btn{
    display:inline-block; text-decoration:none;
    padding:15px 30px; font-size:16px; border-radius:14px;
    color:#241d05; background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    font-weight:600; box-shadow:0 12px 30px -10px rgba(232,185,95,.6);
  }
  .reveal .pending{
    display:inline-block; padding:14px 24px; border-radius:14px;
    border:1px dashed var(--card-line); color:var(--muted); font-size:14px;
  }
  .fade-in{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
  <main class="stage" id="stage" aria-live="polite"></main>

<script>
/* ==========================================================================
   ENLACE DE ONEDRIVE  ·  pega aquí la URL que me pases en el segundo mensaje
   ========================================================================== */
const REVEAL_URL = "https://docs.google.com/document/d/1E06z7NxDhyTenUbd8emgZXG5iSsQwt9J/edit?usp=sharing&ouid=106154613315029301848&rtpof=true&sd=true";

/* Preguntas y respuestas aceptadas (según tu imagen) */
const QUESTIONS = [
  {
    prompt: "¿Cuándo nació Edson?",
    hint: 'Formato de ejemplo: <b>12 de mayo de 1978</b> · <b>12/5/1978</b>',
    answers: ["20 de septiembre de 2012", "20/9/2012", "9/20/2012"]
  },
  {
    prompt: "¿Cuándo nació Hebert Coronel?",
    answers: ["12 de noviembre de 2002", "12/11/2002"]
  },
  {
    prompt: "¿Cuándo naciste tú?",
    answers: ["8 de diciembre de 1980", "8/12/1980"]
  }
];

/* Normaliza texto: minúsculas, sin acentos, espacios simples y sin ceros a
   la izquierda en fechas con "/" (así 08/12/1980 = 8/12/1980). */
function norm(s){
  return s.toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ")
    .replace(/(\d+)\s*\/\s*(\d+)\s*\/\s*(\d+)/, (_,a,b,c)=> `${+a}/${+b}/${+c}`);
}
function isCorrect(input, answers){
  const g = norm(input);
  return answers.some(a => norm(a) === g);
}

let step = 0;
const stage = document.getElementById("stage");

function constellationSVG(){
  const pts = [ [80,32], [200,32], [320,32] ];
  const lit = i => i < step ? "lit" : "";
  const cur = i => i === step ? "current" : "";
  const starPath = (cx,cy) => {
    let d=""; const spikes=5, outer=9, inner=3.6;
    for(let i=0;i<spikes*2;i++){
      const r=i%2===0?outer:inner;
      const ang=(Math.PI/spikes)*i - Math.PI/2;
      d += (i===0?"M":"L") + (cx+r*Math.cos(ang)).toFixed(1) + " " + (cy+r*Math.sin(ang)).toFixed(1) + " ";
    }
    return d+"Z";
  };
  return `
  <svg class="constellation" viewBox="0 0 400 64" role="img" aria-label="Progreso: ${step} de 3">
    <line class="line ${step>0?"lit":""}" x1="80" y1="32" x2="200" y2="32"/>
    <line class="line ${step>1?"lit":""}" x1="200" y1="32" x2="320" y2="32"/>
    ${pts.map((p,i)=>`<path class="star ${lit(i)} ${cur(i)}" d="${starPath(p[0],p[1])}"/>`).join("")}
  </svg>`;
}

function renderQuestion(){
  const q = QUESTIONS[step];
  stage.innerHTML = `
    <p class="eyebrow">Las fechas que importan</p>
    ${constellationSVG()}
    <p class="count">Pregunta ${step+1} de ${QUESTIONS.length}</p>
    <h1 class="question fade-in">${q.prompt}</h1>
    ${q.hint ? `<p class="hint">${q.hint}</p>` : `<p class="hint">Escribe la fecha tal como la recuerdas.</p>`}
    <div class="field">
      <input type="text" id="answer" autocomplete="off" autocapitalize="off"
             placeholder="Tu respuesta…" aria-label="Escribe tu respuesta">
      <button id="submit">Comprobar</button>
    </div>
    <p class="feedback" id="feedback"></p>
  `;
  const input = document.getElementById("answer");
  const submit = document.getElementById("submit");
  const fb = document.getElementById("feedback");
  input.focus();

  function check(){
    const val = input.value.trim();
    if(!val){ return; }
    if(isCorrect(val, q.answers)){
      fb.textContent = "¡Correcto!";
      fb.className = "feedback ok";
      step++;
      setTimeout(()=> step < QUESTIONS.length ? renderQuestion() : renderReveal(), 650);
    }else{
      fb.textContent = "Esa no es. Revisa la fecha e inténtalo otra vez.";
      fb.className = "feedback err";
      const stageEl = document.querySelector(".field");
      stageEl.classList.remove("shake"); void stageEl.offsetWidth; stageEl.classList.add("shake");
      input.select();
    }
  }
  submit.addEventListener("click", check);
  input.addEventListener("keydown", e => { if(e.key==="Enter") check(); });
}

function renderReveal(){
  stage.innerHTML = `
    <p class="eyebrow">Completado</p>
    ${constellationSVG()}
    <div class="reveal fade-in">
      <div class="glyph">✦</div>
      <h2>Las tres fechas, completas.</h2>
      <p>Acertaste todas las fechas. Aquí está lo que estaba esperándote.</p>
      ${REVEAL_URL
        ? `<a class="link-btn" href="${REVEAL_URL}" target="_blank" rel="noopener">Abrir el documento →</a>`
        : `<span class="pending">Enlace pendiente — se colocará en cuanto lo compartas.</span>`}
    </div>
  `;
}

renderQuestion();
</script>
</body>
</html>
